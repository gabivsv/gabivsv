name: Contribution Space

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution space
        run: |
          mkdir -p output

          python - <<'PY'
          import random

          WIDTH = 1100
          HEIGHT = 190

          cols = 52
          rows = 7

          start_x = 35
          start_y = 45
          gap_x = 20
          gap_y = 18

          svg = []

          svg.append(f'''<svg
            width="{WIDTH}"
            height="{HEIGHT}"
            viewBox="0 0 {WIDTH} {HEIGHT}"
            xmlns="http://www.w3.org/2000/svg">

            <rect width="{WIDTH}" height="{HEIGHT}" fill="#000000"/>

            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <filter id="softGlow">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
          ''')

          # Contribution grid
          svg.append('''
            <g id="contributions">
          ''')

          random.seed(42)

          for x in range(cols):
              for y in range(rows):

                  # Prototype intensity.
                  # Later this will come from real GitHub contributions.
                  level = random.choices(
                      [0, 1, 2, 3, 4],
                      weights=[18, 32, 27, 16, 7]
                  )[0]

                  if level == 0:
                      continue

                  cx = start_x + x * gap_x
                  cy = start_y + y * gap_y

                  if level == 1:
                      r = 1.5
                      opacity = 0.35
                  elif level == 2:
                      r = 2.1
                      opacity = 0.55
                  elif level == 3:
                      r = 2.8
                      opacity = 0.78
                  else:
                      r = 3.5
                      opacity = 1

                  filter_id = "url(#glow)" if level >= 3 else ""

                  svg.append(
                      f'<path '
                      f'd="M {cx} {cy-2.2} '
                      f'L {cx+0.9} {cy-0.9} '
                      f'L {cx+2.2} {cy} '
                      f'L {cx+0.9} {cy+0.9} '
                      f'L {cx} {cy+2.2} '
                      f'L {cx-0.9} {cy+0.9} '
                      f'L {cx-2.2} {cy} '
                      f'L {cx-0.9} {cy-0.9} Z" '
                      f'fill="#00FF21" '
                      f'opacity="{opacity}" '
                      f'filter="{filter_id}"/>'
                  )

          svg.append('</g>')

          # Astronaut
          astronaut_y = 88

          svg.append(f'''
            <g id="astronaut">

              <!-- subtle movement -->
              <animateTransform
                attributeName="transform"
                type="translate"
                values="
                  -5 0;
                  0 -2;
                  5 0;
                  0 2;
                  -5 0
                "
                dur="3s"
                repeatCount="indefinite"
              />

              <!-- small trail -->
              <path
                d="M 0 10 L -9 13 M 0 10 L -7 17"
                stroke="#00FF21"
                stroke-width="1"
                opacity="0.35"
              />

              <!-- backpack -->
              <rect
                x="-7"
                y="-2"
                width="4"
                height="13"
                rx="1.5"
                fill="#000"
                stroke="#00FF21"
                stroke-width="1"
              />

              <!-- helmet -->
              <circle
                cx="0"
                cy="-7"
                r="7"
                fill="#000"
                stroke="#00FF21"
                stroke-width="1.2"
              />

              <!-- visor -->
              <path
                d="M -4 -8
                   Q 0 -11 4 -8
                   L 3 -5
                   Q 0 -3 -3 -5
                   Z"
                fill="#00FF21"
                opacity="0.9"
              />

              <!-- body -->
              <rect
                x="-5"
                y="0"
                width="10"
                height="12"
                rx="3"
                fill="#000"
                stroke="#00FF21"
                stroke-width="1.1"
              />

              <!-- left arm -->
              <path
                d="M -5 3 L -10 7"
                stroke="#00FF21"
                stroke-width="1.2"
                stroke-linecap="round"
              />

              <!-- right arm -->
              <path
                d="M 5 3 L 10 0"
                stroke="#00FF21"
                stroke-width="1.2"
                stroke-linecap="round"
              />

              <!-- legs -->
              <path
                d="M -3 12 L -6 18"
                stroke="#00FF21"
                stroke-width="1.2"
                stroke-linecap="round"
              />

              <path
                d="M 3 12 L 6 18"
                stroke="#00FF21"
                stroke-width="1.2"
                stroke-linecap="round"
              />

              <!-- movement across the contribution field -->
              <animateTransform
                attributeName="transform"
                type="translate"
                values="
                  20 {astronaut_y};
                  300 {astronaut_y - 3};
                  580 {astronaut_y};
                  860 {astronaut_y + 3};
                  1100 {astronaut_y};
                  20 {astronaut_y}
                "
                dur="18s"
                repeatCount="indefinite"
              />

            </g>
          ''')

          svg.append('</svg>')

          with open("output/contribution-space.svg", "w", encoding="utf-8") as f:
              f.write("\n".join(svg))
          PY

      - name: Publish animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: output
          force_orphan: true
