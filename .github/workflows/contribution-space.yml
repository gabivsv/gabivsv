name: Contribution Space

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution animation
        run: |
          mkdir -p output

          cat > output/contribution-space.svg <<'EOF'
          <svg width="900" height="180" viewBox="0 0 900 180"
               xmlns="http://www.w3.org/2000/svg">

            <rect width="900" height="180" fill="#000000"/>

            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Estrelas / contribuições -->
            <g fill="#00FF21" filter="url(#glow)">

              <circle cx="35" cy="45" r="2"/>
              <circle cx="55" cy="45" r="3"/>
              <circle cx="75" cy="45" r="1.5"/>
              <circle cx="95" cy="45" r="4"/>
              <circle cx="115" cy="45" r="2"/>
              <circle cx="135" cy="45" r="1.5"/>
              <circle cx="155" cy="45" r="3"/>
              <circle cx="175" cy="45" r="2"/>
              <circle cx="195" cy="45" r="4"/>
              <circle cx="215" cy="45" r="1.5"/>
              <circle cx="235" cy="45" r="3"/>

              <circle cx="35" cy="65" r="1.5"/>
              <circle cx="55" cy="65" r="4"/>
              <circle cx="75" cy="65" r="2"/>
              <circle cx="95" cy="65" r="3"/>
              <circle cx="115" cy="65" r="1.5"/>
              <circle cx="135" cy="65" r="4"/>
              <circle cx="155" cy="65" r="2"/>
              <circle cx="175" cy="65" r="3"/>
              <circle cx="195" cy="65" r="1.5"/>
              <circle cx="215" cy="65" r="4"/>
              <circle cx="235" cy="65" r="2"/>

              <circle cx="35" cy="85" r="3"/>
              <circle cx="55" cy="85" r="1.5"/>
              <circle cx="75" cy="85" r="4"/>
              <circle cx="95" cy="85" r="2"/>
              <circle cx="115" cy="85" r="3"/>
              <circle cx="135" cy="85" r="1.5"/>
              <circle cx="155" cy="85" r="4"/>
              <circle cx="175" cy="85" r="2"/>
              <circle cx="195" cy="85" r="3"/>
              <circle cx="215" cy="85" r="1.5"/>
              <circle cx="235" cy="85" r="4"/>

              <circle cx="35" cy="105" r="2"/>
              <circle cx="55" cy="105" r="3"/>
              <circle cx="75" cy="105" r="1.5"/>
              <circle cx="95" cy="105" r="4"/>
              <circle cx="115" cy="105" r="2"/>
              <circle cx="135" cy="105" r="3"/>
              <circle cx="155" cy="105" r="1.5"/>
              <circle cx="175" cy="105" r="4"/>
              <circle cx="195" cy="105" r="2"/>
              <circle cx="215" cy="105" r="3"/>
              <circle cx="235" cy="105" r="1.5"/>

              <circle cx="35" cy="125" r="4"/>
              <circle cx="55" cy="125" r="2"/>
              <circle cx="75" cy="125" r="3"/>
              <circle cx="95" cy="125" r="1.5"/>
              <circle cx="115" cy="125" r="4"/>
              <circle cx="135" cy="125" r="2"/>
              <circle cx="155" cy="125" r="3"/>
              <circle cx="175" cy="125" r="1.5"/>
              <circle cx="195" cy="125" r="4"/>
              <circle cx="215" cy="125" r="2"/>
              <circle cx="235" cy="125" r="3"/>

            </g>

            <!-- Pequenas estrelas distantes -->
            <g fill="#00FF21" opacity="0.45">
              <circle cx="290" cy="30" r="1"/>
              <circle cx="360" cy="65" r="1"/>
              <circle cx="430" cy="35" r="1"/>
              <circle cx="520" cy="125" r="1"/>
              <circle cx="610" cy="50" r="1"/>
              <circle cx="700" cy="145" r="1"/>
              <circle cx="790" cy="60" r="1"/>
              <circle cx="850" cy="115" r="1"/>
            </g>

            <!-- Astronauta -->
            <g transform="translate(430 70)" fill="none"
               stroke="#00FF21" stroke-width="2">

              <!-- mochila -->
              <rect x="-18" y="5" width="10" height="32"
                    rx="3" fill="#000000"/>

              <!-- capacete -->
              <circle cx="0" cy="0" r="17" fill="#000000"/>

              <!-- visor -->
              <rect x="-10" y="-6" width="20" height="12"
                    rx="6" fill="#00FF21" stroke="none"/>

              <!-- corpo -->
              <rect x="-12" y="16" width="24" height="30"
                    rx="7" fill="#000000"/>

              <!-- braço esquerdo -->
              <path d="M-12 21 L-28 32 L-36 25"/>

              <!-- braço direito -->
              <path d="M12 21 L28 12 L36 18"/>

              <!-- perna esquerda -->
              <path d="M-7 45 L-15 61 L-25 61"/>

              <!-- perna direita -->
              <path d="M7 45 L15 61 L25 61"/>

            </g>

            <!-- Movimento do astronauta -->
            <animateTransform
              href="#astronaut"
              attributeName="transform"
              type="translate"
              values="420 70; 450 65; 480 70; 450 75; 420 70"
              dur="8s"
              repeatCount="indefinite"/>

          </svg>
          EOF

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
